<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinic Agent Configuration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #000511 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #64ffda, #00ff88, #bd93f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #8892b0;
            margin-bottom: 40px;
            font-size: 1.1rem;
        }

        .agents-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .agent-card {
            background: rgba(10, 14, 39, 0.9);
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .agent-card:hover {
            border-color: rgba(100, 255, 218, 0.6);
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.2);
        }

        .agent-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .agent-emoji {
            font-size: 32px;
        }

        .agent-info {
            flex: 1;
        }

        .agent-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: #64ffda;
            margin-bottom: 4px;
        }

        .agent-status {
            font-size: 0.9rem;
            color: #8892b0;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-indicator.inactive {
            background: #666;
        }

        .status-indicator.active {
            background: #50fa7b;
            box-shadow: 0 0 10px #50fa7b;
        }

        .status-indicator.error {
            background: #ff5555;
            box-shadow: 0 0 10px #ff5555;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(100, 255, 218, 0.2);
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #64ffda;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.2);
        }

        select option {
            background: #0a0e27;
            color: #ffffff;
        }

        input[type="password"] {
            font-family: monospace;
        }

        .api-key-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        .api-key-input {
            flex: 1;
        }

        .btn {
            padding: 10px 16px;
            background: linear-gradient(135deg, #64ffda, #00ff88);
            color: #0a0e27;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(100, 255, 218, 0.4);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn.secondary {
            background: rgba(100, 255, 218, 0.1);
            color: #64ffda;
            border: 1px solid rgba(100, 255, 218, 0.3);
        }

        .btn.danger {
            background: rgba(255, 85, 85, 0.1);
            color: #ff5555;
            border: 1px solid rgba(255, 85, 85, 0.3);
        }

        .test-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .test-result.success {
            background: rgba(80, 250, 123, 0.1);
            border: 1px solid rgba(80, 250, 123, 0.3);
            color: #50fa7b;
            display: block;
        }

        .test-result.error {
            background: rgba(255, 85, 85, 0.1);
            border: 1px solid rgba(255, 85, 85, 0.3);
            color: #ff5555;
            display: block;
        }

        .control-panel {
            background: rgba(10, 14, 39, 0.9);
            border: 1px solid rgba(189, 147, 249, 0.3);
            border-radius: 16px;
            padding: 20px;
            margin-top: 30px;
            text-align: center;
        }

        .control-panel h2 {
            color: #bd93f9;
            margin-bottom: 20px;
        }

        .control-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #64ffda;
        }

        .stat-label {
            font-size: 0.9rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .testing {
            animation: pulse 1s infinite;
        }

        .model-select {
            margin-top: 10px;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(100, 255, 218, 0.2);
            border-top-color: #64ffda;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kinic Agent Configuration</h1>
        <p class="subtitle">Configure your AI agents and connect them to the Kinic network</p>

        <div class="agents-grid" id="agentsGrid">
            <!-- Agent cards will be dynamically generated here -->
        </div>

        <div class="control-panel">
            <h2>Control Panel</h2>
            <div class="control-buttons">
                <button class="btn" onclick="saveAllConfigurations()">Save All Configurations</button>
                <button class="btn secondary" onclick="testAllConnections()">Test All Connections</button>
                <button class="btn secondary" onclick="exportConfiguration()">Export Config</button>
                <button class="btn secondary" onclick="importConfiguration()">Import Config</button>
                <button class="btn danger" onclick="clearAllConfigurations()">Clear All</button>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="configuredCount">0</div>
                    <div class="stat-label">Configured</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="activeCount">0</div>
                    <div class="stat-label">Active</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalCount">6</div>
                    <div class="stat-label">Total Agents</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Agent definitions with available platforms and models
        const agents = [
            {
                id: 'researcher',
                name: 'Researcher',
                emoji: '🔬',
                platforms: {
                    'openai': {
                        name: 'OpenAI',
                        models: ['gpt-4-turbo-preview', 'gpt-4', 'gpt-3.5-turbo'],
                        requiresKey: true,
                        testEndpoint: '/test/openai'
                    },
                    'anthropic': {
                        name: 'Anthropic',
                        models: ['claude-3-opus-20240229', 'claude-3-sonnet-20240229', 'claude-3-haiku-20240307'],
                        requiresKey: true,
                        testEndpoint: '/test/anthropic'
                    },
                    'perplexity': {
                        name: 'Perplexity',
                        models: ['pplx-70b-online', 'pplx-7b-online'],
                        requiresKey: true,
                        testEndpoint: '/test/perplexity'
                    },
                    'google': {
                        name: 'Google',
                        models: ['gemini-pro', 'gemini-pro-vision'],
                        requiresKey: true,
                        testEndpoint: '/test/google'
                    }
                }
            },
            {
                id: 'builder',
                name: 'Builder',
                emoji: '🔨',
                platforms: {
                    'openai': {
                        name: 'OpenAI',
                        models: ['gpt-4-turbo-preview', 'gpt-4', 'gpt-3.5-turbo'],
                        requiresKey: true,
                        testEndpoint: '/test/openai'
                    },
                    'anthropic': {
                        name: 'Anthropic',
                        models: ['claude-3-opus-20240229', 'claude-3-sonnet-20240229'],
                        requiresKey: true,
                        testEndpoint: '/test/anthropic'
                    },
                    'local': {
                        name: 'Local (Ollama)',
                        models: ['codellama', 'llama2', 'mistral'],
                        requiresKey: false,
                        testEndpoint: '/test/ollama'
                    }
                }
            },
            {
                id: 'analyzer',
                name: 'Analyzer',
                emoji: '📊',
                platforms: {
                    'openai': {
                        name: 'OpenAI',
                        models: ['gpt-4-turbo-preview', 'gpt-3.5-turbo'],
                        requiresKey: true,
                        testEndpoint: '/test/openai'
                    },
                    'anthropic': {
                        name: 'Anthropic',
                        models: ['claude-3-opus-20240229', 'claude-3-sonnet-20240229'],
                        requiresKey: true,
                        testEndpoint: '/test/anthropic'
                    },
                    'cohere': {
                        name: 'Cohere',
                        models: ['command', 'command-light'],
                        requiresKey: true,
                        testEndpoint: '/test/cohere'
                    }
                }
            },
            {
                id: 'security',
                name: 'Security',
                emoji: '🔒',
                platforms: {
                    'openai': {
                        name: 'OpenAI',
                        models: ['gpt-4', 'gpt-3.5-turbo'],
                        requiresKey: true,
                        testEndpoint: '/test/openai'
                    },
                    'anthropic': {
                        name: 'Anthropic',
                        models: ['claude-3-opus-20240229'],
                        requiresKey: true,
                        testEndpoint: '/test/anthropic'
                    }
                }
            },
            {
                id: 'orchestrator',
                name: 'Orchestrator',
                emoji: '🎭',
                platforms: {
                    'openai': {
                        name: 'OpenAI',
                        models: ['gpt-4-turbo-preview', 'gpt-4'],
                        requiresKey: true,
                        testEndpoint: '/test/openai'
                    },
                    'anthropic': {
                        name: 'Anthropic',
                        models: ['claude-3-opus-20240229', 'claude-3-sonnet-20240229'],
                        requiresKey: true,
                        testEndpoint: '/test/anthropic'
                    }
                }
            },
            {
                id: 'connector',
                name: 'Connector',
                emoji: '🔗',
                platforms: {
                    'openai': {
                        name: 'OpenAI',
                        models: ['gpt-3.5-turbo'],
                        requiresKey: true,
                        testEndpoint: '/test/openai'
                    },
                    'anthropic': {
                        name: 'Anthropic',
                        models: ['claude-3-haiku-20240307'],
                        requiresKey: true,
                        testEndpoint: '/test/anthropic'
                    },
                    'huggingface': {
                        name: 'HuggingFace',
                        models: ['meta-llama/Llama-2-7b', 'google/flan-t5-base'],
                        requiresKey: true,
                        testEndpoint: '/test/huggingface'
                    }
                }
            }
        ];

        // Load saved configurations from localStorage
        function loadConfigurations() {
            const saved = localStorage.getItem('agentConfigurations');
            return saved ? JSON.parse(saved) : {};
        }

        // Save configurations to localStorage
        function saveConfigurations(configs) {
            localStorage.setItem('agentConfigurations', JSON.stringify(configs));
            updateStats();
        }

        // Generate agent cards
        function generateAgentCards() {
            const grid = document.getElementById('agentsGrid');
            const configs = loadConfigurations();
            
            agents.forEach(agent => {
                const config = configs[agent.id] || {};
                const card = document.createElement('div');
                card.className = 'agent-card';
                card.id = `agent-${agent.id}`;
                
                // Build platform options
                let platformOptions = '<option value="">Select Platform</option>';
                Object.keys(agent.platforms).forEach(key => {
                    const selected = config.platform === key ? 'selected' : '';
                    platformOptions += `<option value="${key}" ${selected}>${agent.platforms[key].name}</option>`;
                });
                
                // Build model options if platform is selected
                let modelOptions = '<option value="">Select Model</option>';
                if (config.platform && agent.platforms[config.platform]) {
                    agent.platforms[config.platform].models.forEach(model => {
                        const selected = config.model === model ? 'selected' : '';
                        modelOptions += `<option value="${model}" ${selected}>${model}</option>`;
                    });
                }
                
                const apiKeyValue = config.apiKey || '';
                const statusClass = config.status || 'inactive';
                
                card.innerHTML = `
                    <div class="agent-header">
                        <div class="agent-emoji">${agent.emoji}</div>
                        <div class="agent-info">
                            <div class="agent-name">${agent.name}</div>
                            <div class="agent-status">
                                <span class="status-indicator ${statusClass}"></span>
                                <span id="status-${agent.id}">${statusClass === 'active' ? 'Connected' : 'Not configured'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="platform-${agent.id}">Platform</label>
                        <select id="platform-${agent.id}" onchange="handlePlatformChange('${agent.id}')">
                            ${platformOptions}
                        </select>
                    </div>
                    
                    <div class="form-group model-select" id="model-group-${agent.id}" style="${config.platform ? 'display:block' : 'display:none'}">
                        <label for="model-${agent.id}">Model</label>
                        <select id="model-${agent.id}">
                            ${modelOptions}
                        </select>
                    </div>
                    
                    <div class="form-group" id="apikey-group-${agent.id}" style="${config.platform && agent.platforms[config.platform]?.requiresKey ? 'display:block' : 'display:none'}">
                        <label for="apikey-${agent.id}">API Key</label>
                        <div class="api-key-group">
                            <div class="api-key-input">
                                <input type="password" id="apikey-${agent.id}" placeholder="Enter API key..." value="${apiKeyValue}">
                            </div>
                            <button class="btn" onclick="testConnection('${agent.id}')">Test</button>
                        </div>
                    </div>
                    
                    <div class="test-result" id="test-result-${agent.id}"></div>
                `;
                
                grid.appendChild(card);
            });
            
            updateStats();
        }

        // Handle platform change
        function handlePlatformChange(agentId) {
            const agent = agents.find(a => a.id === agentId);
            const platformSelect = document.getElementById(`platform-${agentId}`);
            const selectedPlatform = platformSelect.value;
            
            const modelGroup = document.getElementById(`model-group-${agentId}`);
            const modelSelect = document.getElementById(`model-${agentId}`);
            const apiKeyGroup = document.getElementById(`apikey-group-${agentId}`);
            
            if (selectedPlatform && agent.platforms[selectedPlatform]) {
                // Show model selection
                modelGroup.style.display = 'block';
                
                // Update model options
                modelSelect.innerHTML = '<option value="">Select Model</option>';
                agent.platforms[selectedPlatform].models.forEach(model => {
                    modelSelect.innerHTML += `<option value="${model}">${model}</option>`;
                });
                
                // Show/hide API key field
                if (agent.platforms[selectedPlatform].requiresKey) {
                    apiKeyGroup.style.display = 'block';
                } else {
                    apiKeyGroup.style.display = 'none';
                }
            } else {
                modelGroup.style.display = 'none';
                apiKeyGroup.style.display = 'none';
            }
            
            // Reset status
            updateAgentStatus(agentId, 'inactive', 'Not configured');
        }

        // Test connection for a specific agent
        async function testConnection(agentId) {
            const agent = agents.find(a => a.id === agentId);
            const platform = document.getElementById(`platform-${agentId}`).value;
            const model = document.getElementById(`model-${agentId}`).value;
            const apiKey = document.getElementById(`apikey-${agentId}`)?.value;
            const resultDiv = document.getElementById(`test-result-${agentId}`);
            
            if (!platform || !model) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = 'Please select platform and model';
                resultDiv.style.display = 'block';
                return;
            }
            
            if (agent.platforms[platform].requiresKey && !apiKey) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = 'API key is required';
                resultDiv.style.display = 'block';
                return;
            }
            
            // Show testing state
            updateAgentStatus(agentId, 'testing', 'Testing connection...');
            resultDiv.className = 'test-result';
            resultDiv.innerHTML = '<div class="spinner"></div> Testing connection...';
            resultDiv.style.display = 'block';
            
            try {
                // Simulate API test (replace with actual backend call)
                const response = await testAPIConnection(platform, model, apiKey);
                
                if (response.success) {
                    resultDiv.className = 'test-result success';
                    resultDiv.textContent = `✅ Connected successfully! Model: ${model}`;
                    updateAgentStatus(agentId, 'active', 'Connected');
                    
                    // Save configuration
                    const configs = loadConfigurations();
                    configs[agentId] = {
                        platform,
                        model,
                        apiKey,
                        status: 'active'
                    };
                    saveConfigurations(configs);
                } else {
                    throw new Error(response.error || 'Connection failed');
                }
            } catch (error) {
                resultDiv.className = 'test-result error';
                resultDiv.textContent = `❌ ${error.message}`;
                updateAgentStatus(agentId, 'error', 'Connection failed');
            }
        }

        // Simulate API connection test (replace with actual backend call)
        async function testAPIConnection(platform, model, apiKey) {
            // Simulate network delay
            await new Promise(resolve => setTimeout(resolve, 1500));
            
            // For demo purposes, simulate success/failure
            // In production, this would call your backend API
            if (platform === 'local') {
                // Local doesn't need API key
                return { success: true };
            }
            
            if (apiKey && apiKey.length > 10) {
                // Simulate successful connection
                return { success: true };
            } else {
                // Simulate failure
                return { 
                    success: false, 
                    error: 'Invalid API key or connection error' 
                };
            }
        }

        // Update agent status display
        function updateAgentStatus(agentId, status, text) {
            const statusIndicator = document.querySelector(`#agent-${agentId} .status-indicator`);
            const statusText = document.getElementById(`status-${agentId}`);
            const card = document.getElementById(`agent-${agentId}`);
            
            statusIndicator.className = `status-indicator ${status}`;
            statusText.textContent = text;
            
            if (status === 'testing') {
                card.classList.add('testing');
            } else {
                card.classList.remove('testing');
            }
        }

        // Test all connections
        async function testAllConnections() {
            for (const agent of agents) {
                const platform = document.getElementById(`platform-${agent.id}`).value;
                if (platform) {
                    await testConnection(agent.id);
                    await new Promise(resolve => setTimeout(resolve, 500)); // Delay between tests
                }
            }
        }

        // Save all configurations
        function saveAllConfigurations() {
            const configs = {};
            agents.forEach(agent => {
                const platform = document.getElementById(`platform-${agent.id}`).value;
                const model = document.getElementById(`model-${agent.id}`).value;
                const apiKey = document.getElementById(`apikey-${agent.id}`)?.value;
                
                if (platform && model) {
                    configs[agent.id] = {
                        platform,
                        model,
                        apiKey,
                        status: apiKey ? 'inactive' : 'inactive'
                    };
                }
            });
            
            saveConfigurations(configs);
            alert('Configurations saved successfully!');
        }

        // Export configuration
        function exportConfiguration() {
            const configs = loadConfigurations();
            const dataStr = JSON.stringify(configs, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'kinic-agent-config.json';
            link.click();
        }

        // Import configuration
        function importConfiguration() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const configs = JSON.parse(event.target.result);
                        saveConfigurations(configs);
                        location.reload(); // Refresh to show imported config
                    } catch (error) {
                        alert('Invalid configuration file');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        // Clear all configurations
        function clearAllConfigurations() {
            if (confirm('Are you sure you want to clear all configurations?')) {
                localStorage.removeItem('agentConfigurations');
                location.reload();
            }
        }

        // Update statistics
        function updateStats() {
            const configs = loadConfigurations();
            const configured = Object.keys(configs).length;
            const active = Object.values(configs).filter(c => c.status === 'active').length;
            
            document.getElementById('configuredCount').textContent = configured;
            document.getElementById('activeCount').textContent = active;
        }

        // Initialize
        generateAgentCards();
    </script>
</body>
</html>
